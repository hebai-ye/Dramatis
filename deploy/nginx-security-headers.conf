# 安全响应头片段（审计 A15），由 nginx-8443.conf.example include。
#
# 用法：sudo cp nginx-security-headers.conf /etc/nginx/snippets/dramatis-security-headers.conf
#
# 为什么做成片段：nginx 的 add_header 只要某个 location 里写了一条，
# 就**不再继承** server 级的所有 add_header。所以 server 级和 location = /sw.js
# 里都 include 这一个文件，避免 sw.js 悄悄丢掉安全头。
#
# CSP 说明（按 apps/web 构建产物核对过：index.html 无内联脚本，只有外链 module 脚本和样式）：
#   script-src 'self'           只允许同源脚本，挡住注入脚本偷浏览器里的密钥（也缓解 B18）
#   style-src 'unsafe-inline'   React 的 style={{...}} 属性需要，风险远低于脚本
#   connect-src https: + 本机   用户可以自填任意模型地址（https）；本地模型/本地助手走 127.0.0.1 / localhost
#   img-src data: blob: https:  自定义背景图、角色卡头像可能是 data URL 或外链
#
# 上线步骤（Report-Only 灰度）：
#   1) 先保持下面的 Content-Security-Policy-Report-Only，reload nginx，
#      在浏览器里把各功能走一遍（聊天、同步、导入卡、换背景、本地模型），看控制台有没有 CSP 报错。
#   2) 观察几天没问题后，把 Report-Only 那行注释掉、打开下面 Content-Security-Policy 那行，再 reload。
#   3) 若有报错，按报错补到对应指令里，不要直接放开 script-src。

# HSTS：只在确认 https 一切正常后保留；没加 includeSubDomains/preload，免得牵连其它子域名
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
