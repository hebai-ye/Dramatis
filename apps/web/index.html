<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover`：让页面铺到 iPhone 的刘海/横条区域里，配合 CSS 里的
      `env(safe-area-inset-*)` 才拿得到真实的安全区数值（否则那几个 env() 恒为 0）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <meta name="description" content="多角色扮演酒馆：一条世界线里同时有几个角色，各自记得不同的事。" />
    <!-- PWA（P2-2）：装到手机桌面后离线也能打开；模型请求一概不缓存，见 public/sw.js -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dramatis" />
    <title>Dramatis · 登场</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
