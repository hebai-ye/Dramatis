name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限（审计 B20）：CI 只需要读代码
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11.22.0 要求 Node >=22.13；覆盖支持下界与 Node 24。
        node-version: ['22.13.0', '24']
    steps:
      # actions 固定到提交 SHA，注释里是对应的版本号（审计 B20）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint 与格式检查
        run: pnpm lint

      # 包含 apps/web/tools（apps/web/tsconfig.tools.json）
      - name: 类型检查
        run: pnpm typecheck

      # 根 test 串行运行工作区、管理台 SQLite / HTTP 与本地助手 Node 专项，各一次。
      - name: 单元测试（含服务器管理台与本地助手）
        run: pnpm test

      - name: 构建
        run: pnpm build

      # 线上跑的同步服务端（审计 A14）：以前坏了 CI 也是绿的
      - name: 构建同步服务端
        run: pnpm build:sync-server
